<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>SaifKS Research Planner</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="brand">♛ <b>SaifKS</b><span>Research Planner</span></div><button id="lang">EN</button></header>
<main><section class="hero"><small>KINGSHOT ACADEMY</small><h1 data-ar="مخطط البحوث" data-en="Research Planner">مخطط البحوث</h1><p data-ar="اختر الشجرة، ثم البحث، وحدد مستواك الحالي والهدف. تظهر النتيجة مباشرة." data-en="Choose a tree and technology, then select your current and target levels. Results appear instantly.">اختر الشجرة، ثم البحث، وحدد مستواك الحالي والهدف. تظهر النتيجة مباشرة.</p></section>
<div id="tabs" class="tabs"></div>
<section class="grid">
<div class="card"><h2>1. <span data-ar="اختيار البحث" data-en="Choose Research">اختيار البحث</span></h2><label data-ar="البحث" data-en="Technology">البحث</label><select id="tech"></select><div id="meta" class="meta"></div><div class="two"><div><label data-ar="المستوى الحالي" data-en="Current Level">المستوى الحالي</label><select id="cur"></select></div><div><label data-ar="المستوى المستهدف" data-en="Target Level">المستوى المستهدف</label><select id="target"></select></div></div></div>
<div class="card"><h2>2. <span data-ar="الوقت والتسريعات" data-en="Time & Speedups">الوقت والتسريعات</span></h2><label data-ar="مكافأة سرعة البحث %" data-en="Research Speed Bonus %">مكافأة سرعة البحث %</label><input id="speed" inputmode="decimal" placeholder="0"><div class="three"><input id="days" placeholder="أيام"><input id="hours" placeholder="ساعات"><input id="mins" placeholder="دقائق"></div></div>
<div class="card full"><h2>3. <span data-ar="الموارد المتوفرة" data-en="Available Resources">الموارد المتوفرة</span></h2><div class="resources"><label>🍞 <input id="bread" placeholder="Bread"></label><label>🪵 <input id="wood" placeholder="Wood"></label><label>🪨 <input id="stone" placeholder="Stone"></label><label>⚙️ <input id="iron" placeholder="Iron"></label><label>🪙 <input id="gold" placeholder="Gold"></label></div></div>
</section>
<section class="card result"><h2>4. <span data-ar="ملخص الخطة" data-en="Plan Summary">ملخص الخطة</span></h2><div id="notice"></div><div id="res" class="results"></div><div class="times"><div><small>Base</small><b id="base">—</b></div><div><small>After Speed</small><b id="actual">—</b></div><div><small>Speedups</small><b id="avail">—</b></div><div><small>Remaining</small><b id="remain">—</b></div></div><div class="actions"><button id="copy">نسخ الملخص</button><button id="reset">إعادة الضبط</button></div></section>
</main><footer>SaifKS.com | Built by Saif</footer><script src="app.js"></script></body></html>
