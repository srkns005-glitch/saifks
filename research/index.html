/* v5 tree layout */
.hero{padding:14px 16px}.hero h1{font-size:clamp(21px,3vw,29px)}.hero p{font-size:12px}
.controls{position:relative;top:auto;margin-top:10px}.section-head{margin-top:14px}
.groups{display:block;overflow-x:auto;overflow-y:hidden;padding:4px 2px 18px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tree-board{display:flex;align-items:flex-start;gap:28px;min-width:max-content;padding:4px 10px 14px}
.tree-tier{position:relative;width:250px;scroll-snap-align:start}
.tree-tier:not(:last-child)::after{content:'➜';position:absolute;top:38px;inset-inline-end:-23px;color:var(--gold);font-size:20px;opacity:.7}
.tier-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:#0c1826;box-shadow:0 8px 20px #0005}
.tier-head b{font-size:13px}.tier-head span{color:var(--muted);font-size:10px}
.tier-nodes{display:grid;gap:10px}

.tree-node:not(:last-child)::after{content:'';position:absolute;left:50%;bottom:-11px;width:2px;height:11px;background:var(--line)}
.node-top{display:flex;align-items:flex-start;gap:9px}.node-icon{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:10px;background:var(--iconbg);color:var(--accent)}
.node-copy{min-width:0;flex:1}.node-copy h3{margin:0;font-size:12px;line-height:1.35}.node-copy p{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.07)}
.node-effect{color:var(--accent);font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-max{flex:0 0 auto;color:var(--muted);font-size:9px}

$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tree]');if(!b)return;activeTree=b.dataset.tree;localStorage.setItem('saifks-research-active-tree',activeTree);activeFilter='all';render();window.scrollTo({top:Math.max(0,$('#tabs').offsetTop-70),behavior:'smooth'})});$('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;activeFilter=b.dataset.filter;renderChips();renderCards()});$('#groups').addEventListener('click',e=>{const b=e.target.closest('[data-tech]');if(b)openTech(b.dataset.tech)});$('#planList').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;plan.splice(Number(b.dataset.remove),1);renderPlan()});$('#search').addEventListener('input',renderCards);$('#current').addEventListener('change',onCurrentChange);$('#target').addEventListener('change',onTargetChange);$('#add').addEventListener('click',addPlan);$('#fab').addEventListener('click',openPlanner);$('#clear').addEventListener('click',()=>{plan=[];renderPlan()});$('#copy').addEventListener('click',copySummary);$('#langBtn').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';applyLang()});$('#homeBtn').addEventListener('click',()=>location.href='/');$$('[data-close-planner]').forEach(x=>x.addEventListener('click',closePlanner));$$('[data-close-modal]').forEach(x=>x.addEventListener('click',closeModal));document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePlanner();closeModal()}});
function syncSettingsUI(){$('#researchBonus').value=Number(settings.researchBonus)>0?settings.researchBonus:'';$('#speedDays').value=Number(settings.speedDays)>0?settings.speedDays:'';$('#speedHours').value=Number(settings.speedHours)>0?settings.speedHours:'';$('#speedMinutes').value=Number(settings.speedMinutes)>0?settings.speedMinutes:''}
function updateSettings(){settings.researchBonus=Math.max(0,Number($('#researchBonus').value)||0);settings.speedDays=Math.max(0,Number($('#speedDays').value)||0);settings.speedHours=Math.max(0,Math.min(23,Number($('#speedHours').value)||0));settings.speedMinutes=Math.max(0,Math.min(59,Number($('#speedMinutes').value)||0));localStorage.setItem('saifks-research-settings-v7',JSON.stringify(settings));calc();renderPlan()}
['researchBonus','speedDays','speedHours','speedMinutes'].forEach(id=>$('#'+id).addEventListener('input',updateSettings));syncSettingsUI();$('#techCount').textContent=DB.meta.parsedTotals.technologies;$('#levelCount').textContent=DB.meta.parsedTotals.levels;applyLang();
</script>
</body></html>
