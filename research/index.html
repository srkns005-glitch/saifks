<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08111f">
<title>SaifKS Research Center</title>
<style>
:root{
  --bg:#07101d;--panel:#0d1828;--panel2:#111f33;--panel3:#162842;
  --line:#243a58;--text:#f5f8fc;--muted:#91a4bd;--accent:#45d3a2;
  --accent2:#5aa9ff;--gold:#ffc857;--danger:#ff6b7d;--purple:#a889ff;
  --shadow:0 22px 60px rgba(0,0,0,.35);--radius:20px
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:
radial-gradient(circle at 85% 0%,rgba(69,211,162,.11),transparent 32%),
radial-gradient(circle at 0% 20%,rgba(90,169,255,.1),transparent 28%),var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;background:rgba(7,16,29,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.07)}
.topbar-inner{max-width:1600px;margin:auto;padding:15px 22px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#1e3650,#0b1727);border:1px solid #315070;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.logo:before{content:"";width:20px;height:20px;border:3px solid var(--accent);border-radius:50%;box-shadow:0 0 22px rgba(69,211,162,.5)}
.brand h1{font-size:18px;margin:0;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.section-tabs-wrap{border-top:1px solid rgba(255,255,255,.05);background:rgba(8,18,31,.78)}
.tabs{max-width:1600px;margin:auto;padding:10px 22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tab{position:relative;border:1px solid transparent;background:transparent;color:var(--muted);padding:12px 16px;border-radius:14px;white-space:nowrap;transition:.22s;font-weight:800}
.tab:hover{color:#dbe7f5;background:rgba(255,255,255,.035)}
.tab:after{content:"";position:absolute;right:22%;left:22%;bottom:3px;height:3px;border-radius:20px;background:transparent;transition:.22s}
.tab.active{background:linear-gradient(135deg,rgba(69,211,162,.16),rgba(90,169,255,.11));color:white;border-color:rgba(69,211,162,.38);box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)}
.tab.active:after{right:12%;left:12%;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 16px rgba(69,211,162,.45)}
.tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:20px;margin-inline-start:7px;padding:0 6px;border-radius:10px;background:#13243a;color:#8fa6c0;font-size:9px}
.tab.active .tab-count{background:rgba(69,211,162,.14);color:#baf6e3}
.header-actions{display:flex;gap:8px}
.icon-btn,.primary-btn,.ghost-btn,.danger-btn{border:1px solid var(--line);border-radius:12px;padding:10px 13px;color:white;background:#102038}
.primary-btn{background:linear-gradient(135deg,#26b98a,#318cd9);border:0;font-weight:800}
.ghost-btn{color:var(--muted)}.danger-btn{color:#ff9ca8;border-color:rgba(255,107,125,.35)}
.layout{max-width:1600px;margin:auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px}
.workspace{min-width:0}
.control-panel{background:rgba(13,24,40,.86);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.control-row{display:grid;grid-template-columns:minmax(230px,1fr) repeat(2,minmax(150px,220px)) auto;gap:12px;align-items:end}
.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 7px}
.field input,.field select{width:100%;height:45px;border-radius:12px;border:1px solid var(--line);background:#091526;color:white;padding:0 13px;outline:none;font-size:16px}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(69,211,162,.1)}
.tree-shell{background:rgba(13,24,40,.8);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.tree-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.tree-title h2{font-size:17px;margin:0}.tree-title p{color:var(--muted);font-size:12px;margin:5px 0 0}
.legend{display:flex;gap:9px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%;background:#52647b}.dot.progress{background:var(--accent2)}.dot.plan{background:var(--accent)}.dot.max{background:var(--purple)}
.tree-viewport{position:relative;overflow:auto;min-height:620px;max-height:calc(100vh - 240px);padding:25px}
.tree-canvas{transform-origin:top right;transition:transform .18s,opacity .18s;min-width:890px}
.tier{position:relative;margin:0 0 36px;padding-top:26px}
.tier:not(:first-child):before{content:"";position:absolute;top:-22px;right:50%;width:2px;height:24px;background:linear-gradient(var(--line),rgba(69,211,162,.5))}
.tier-label{position:absolute;top:0;right:50%;transform:translateX(50%);font-size:10px;color:#7890ac;background:#0b1727;border:1px solid var(--line);padding:4px 9px;border-radius:20px}
.nodes{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:14px;align-items:stretch}
.node{position:relative;border:1px solid var(--line);background:linear-gradient(155deg,#12243a,#0b1727);border-radius:17px;padding:14px;min-height:127px;text-align:right;color:white;transition:.18s;overflow:hidden}
.node:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:#4c6079}
.node:hover{transform:translateY(-3px);border-color:#41658b;box-shadow:0 15px 28px rgba(0,0,0,.28)}
.node.in-progress:before{background:var(--accent2)}.node.in-plan:before{background:var(--accent)}.node.is-max:before{background:var(--purple)}
.node.in-plan{border-color:rgba(69,211,162,.55);box-shadow:0 0 0 3px rgba(69,211,162,.07)}
.node-top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.node-name{font-weight:800;font-size:13px;line-height:1.35}.node-max{font-size:9px;color:#8da1ba;border:1px solid var(--line);padding:3px 6px;border-radius:7px;white-space:nowrap}
.node-buff{font-size:10px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.level-strip{margin-top:13px;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.level-box{border:1px solid #273d59;border-radius:10px;padding:7px 6px;background:#091524;text-align:center}.level-box b{display:block;font-size:14px}.level-box small{font-size:8px;color:#7890aa}
.arrow{color:#55708f;font-size:14px}
.delta{margin-top:8px;color:var(--accent);font-size:10px;font-weight:700}
.empty{padding:70px 20px;text-align:center;color:var(--muted)}
.sidebar{position:sticky;top:95px;height:calc(100vh - 115px);display:flex;flex-direction:column;gap:14px}
.summary-card,.plan-card{background:rgba(13,24,40,.9);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.card-head h3{margin:0;font-size:15px}.count{background:rgba(69,211,162,.13);color:var(--accent);padding:4px 9px;border-radius:20px;font-size:11px}
.summary-grid{padding:13px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.metric{background:#091526;border:1px solid #1c3049;border-radius:14px;padding:12px}.metric span{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;margin-top:5px;font-size:14px}.metric.wide{grid-column:1/-1}.metric.accent strong{color:var(--accent)}
.resources{padding:0 13px 13px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.resource{display:flex;justify-content:space-between;border:1px solid #1c3049;background:#091526;border-radius:11px;padding:9px;font-size:11px}.resource span{color:var(--muted)}
.plan-card{min-height:0;display:flex;flex-direction:column;flex:1}.plan-list{padding:10px;overflow:auto;min-height:0}
.plan-item{padding:11px;border:1px solid #203652;background:#0a1727;border-radius:13px;margin-bottom:8px}.plan-item-top{display:flex;justify-content:space-between;gap:7px}.plan-item b{font-size:12px}.remove{border:0;background:transparent;color:#ff8090;padding:0}.plan-item small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.plan-actions{padding:11px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;opacity:0;pointer-events:none;transition:.2s}
.drawer-backdrop.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;width:min(470px,100%);height:100vh;background:#0b1727;border-right:1px solid #29415f;z-index:80;transform:translateX(-105%);transition:.28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:30px 0 70px rgba(0,0,0,.45)}
.drawer.show{transform:translateX(0)}
.drawer-head{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}.drawer-head h2{font-size:19px;margin:0}.drawer-head p{font-size:11px;color:var(--muted);margin:6px 0 0}
.drawer-body{padding:18px;overflow:auto}.close{width:38px;height:38px;padding:0}
.detail-buff{padding:13px;border-radius:14px;border:1px solid rgba(69,211,162,.25);background:rgba(69,211,162,.07);color:#c9ffed;font-size:12px;margin-bottom:14px}
.selector-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.level-preview{margin:14px 0;display:grid;grid-template-columns:1fr 1fr;gap:9px}.preview{background:#091526;border:1px solid #213651;border-radius:13px;padding:12px}.preview span{color:var(--muted);font-size:10px;display:block}.preview b{font-size:13px;display:block;margin-top:5px}
.requirements{margin-top:14px}.req-title{font-size:12px;color:var(--muted);margin-bottom:8px}.req{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #233a56;font-size:11px}
.drawer-footer{padding:15px 18px;border-top:1px solid var(--line);margin-top:auto;display:grid;grid-template-columns:1fr auto;gap:9px}
.toast{position:fixed;bottom:25px;right:50%;transform:translateX(50%) translateY(30px);opacity:0;background:#12263d;border:1px solid #315579;border-radius:12px;padding:11px 16px;z-index:100;transition:.2s;font-size:12px}.toast.show{opacity:1;transform:translateX(50%) translateY(0)}

.save-status{
  display:flex;align-items:center;justify-content:center;gap:7px;
  margin:-5px 0 13px;padding:9px 11px;border-radius:11px;
  background:rgba(90,169,255,.08);border:1px solid rgba(90,169,255,.2);
  color:#9fcaff;font-size:11px
}
.save-status.saved{background:rgba(69,211,162,.08);border-color:rgba(69,211,162,.25);color:#9ff0d4}
.mobile-summary-toggle{display:none}
@media(max-width:760px){
  body{overflow-x:hidden}
  .layout{display:block;padding:8px}
  .control-panel{padding:11px;margin-bottom:10px;border-radius:15px}
  .control-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .control-row .field:first-child{grid-column:1/-1}
  .control-row .field label{font-size:10px;margin-bottom:5px}
  .control-row .field input{height:42px;font-size:16px}
  .control-row button{grid-column:1/-1;height:40px;padding:7px 10px}
  .tree-shell{border-radius:15px}
  .tree-head{padding:11px 12px}
  .tree-title h2{font-size:15px}.tree-title p{font-size:10px}
  .legend{display:none}
  .tree-viewport{padding:10px;min-height:420px;overflow:visible}
  .tree-canvas{min-width:0!important;transform:none!important}
  .tier{margin-bottom:18px;padding-top:25px}
  .nodes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .node{min-height:102px;padding:10px;border-radius:13px}
  .node:hover{transform:none}
  .node-name{font-size:11px}
  .node-max{font-size:8px;padding:2px 5px}
  .node-buff{font-size:9px;margin-top:4px}
  .level-strip{margin-top:8px;gap:4px}
  .level-box{padding:5px 3px;border-radius:8px}
  .level-box b{font-size:12px}.level-box small{font-size:7px}
  .delta{margin-top:5px;font-size:9px}
  .sidebar{display:block;position:static;height:auto;margin-top:10px}
  .summary-card{margin-bottom:10px;border-radius:15px}
  .summary-grid{padding:9px;gap:6px}
  .metric{padding:9px;border-radius:10px}
  .metric span{font-size:9px}.metric strong{font-size:12px}
  .resources{padding:0 9px 9px;gap:6px}
  .resource{padding:7px;font-size:10px}
  .plan-card{max-height:none;border-radius:15px}
  .plan-list{max-height:320px}
  .card-head{padding:11px 12px}
  .plan-actions{position:sticky;bottom:0;background:#0d1828;z-index:3}
  .drawer{top:auto;bottom:0;height:min(88vh,760px);border-right:0;border-top:1px solid #29415f;
          border-radius:22px 22px 0 0;transform:translateY(105%)}
  .drawer.show{transform:translateY(0)}
  .drawer-head{padding:14px 14px 11px}
  .drawer-head h2{font-size:16px}
  .drawer-body{padding:13px}
  .selector-grid{gap:8px}
  .level-preview{margin:10px 0;gap:7px}
  .preview{padding:9px;border-radius:10px}
  .drawer-footer{position:sticky;bottom:0;background:#0b1727;padding:10px 12px;
                 grid-template-columns:1fr;border-top:1px solid var(--line)}
  .drawer-footer .ghost-btn{display:none}
}
@media(max-width:390px){
  .nodes{grid-template-columns:1fr}
  .node{min-height:92px}
}

@media(max-width:1100px){.layout{grid-template-columns:1fr}.sidebar{position:relative;top:auto;height:auto;display:grid;grid-template-columns:1fr 1fr}.plan-card{max-height:460px}.tree-viewport{max-height:none}.nodes{grid-template-columns:repeat(3,minmax(190px,1fr))}}
@media(max-width:760px){
 .topbar-inner{padding:11px 12px}.brand{flex:1}.brand small{display:none}.header-actions{display:none}
 .section-tabs-wrap{overflow:hidden}
 .tabs{padding:8px;gap:6px;grid-template-columns:repeat(3,1fr)}
 .tab{padding:10px 5px;border-radius:11px;font-size:11px}
 .tab-count{display:none}
 .layout{padding:11px}.control-row{grid-template-columns:1fr 1fr}.control-row .field:first-child{grid-column:1/-1}.control-row button{grid-column:1/-1}
 .sidebar{display:block}.summary-card{margin-bottom:12px}.tree-head{align-items:flex-start;flex-direction:column}.tree-viewport{padding:15px;min-height:500px}
 .tree-canvas{min-width:760px}.nodes{grid-template-columns:repeat(3,minmax(180px,1fr));gap:10px}.node{min-height:120px;padding:11px}
 .summary-grid{grid-template-columns:1fr 1fr}.drawer{width:100%}
}
</style>

<style id="research-visibility-fix">
/* V3.3: ensure the full research tree is always reachable */
.tree-viewport{
  max-height:none !important;
  min-height:0 !important;
  overflow-x:auto !important;
  overflow-y:visible !important;
  padding-bottom:70px !important;
}
.tree-canvas{
  opacity:1;
  transform:none !important;
  min-height:max-content;
}
.tier,.nodes,.node{
  visibility:visible !important;
}
@media (min-width:1101px){
  .tree-canvas{min-width:890px}
}
@media (max-width:1100px){
  .tree-canvas{min-width:760px}
}
@media (max-width:760px){
  .tree-viewport{
    overflow:visible !important;
    padding:10px 8px 45px !important;
  }
  .tree-canvas{
    min-width:0 !important;
    width:100% !important;
    zoom:1 !important;
  }
  .nodes{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    width:100%;
  }
  .node{
    width:100%;
    min-width:0;
  }
}
@media (max-width:390px){
  .nodes{grid-template-columns:1fr !important}
}
</style>


<style id="pdf-tree-order">
.pdf-row{margin-bottom:22px}
.pdf-row .nodes{max-width:980px;margin-inline:auto}
.pdf-row .nodes.row-1{grid-template-columns:minmax(220px,360px);justify-content:center}
.pdf-row .nodes.row-2{grid-template-columns:repeat(2,minmax(190px,320px));justify-content:center}
.pdf-row .nodes.row-3{grid-template-columns:repeat(3,minmax(180px,1fr))}
.pdf-row .tier-label{background:linear-gradient(90deg,transparent,rgba(90,169,255,.12),transparent);padding:5px 10px}
@media(max-width:760px){
 .pdf-row .nodes.row-1,.pdf-row .nodes.row-2,.pdf-row .nodes.row-3{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 .pdf-row .nodes.row-1 .node:only-child{grid-column:1/-1;max-width:72%;justify-self:center}
 .pdf-row{margin-bottom:14px}
 .pdf-row .tier-label{font-size:9px;padding:3px 8px}
}
@media(max-width:390px){
 .pdf-row .nodes.row-1,.pdf-row .nodes.row-2,.pdf-row .nodes.row-3{grid-template-columns:1fr!important}
 .pdf-row .nodes.row-1 .node:only-child{grid-column:auto;max-width:none}
}
</style>


<style id="inline-level-selectors">
.node{cursor:default}
.inline-levels{
 display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:7px;margin-top:10px
}
.inline-levels label{display:flex;flex-direction:column;gap:5px;min-width:0}
.inline-levels small{font-size:9px;color:var(--muted);text-align:center}
.inline-levels select{
 width:100%;height:38px;border:1px solid #29415f;border-radius:10px;
 background:#091525;color:#fff;text-align:center;font-weight:900;font-size:13px;
 padding:0 7px;outline:none;appearance:auto
}
.inline-levels select:focus{
 border-color:var(--accent);box-shadow:0 0 0 3px rgba(69,211,162,.11)
}
.inline-levels .arrow{align-self:center;margin-top:14px;color:var(--accent2);font-weight:900}
.node.in-plan .inline-levels select{border-color:rgba(69,211,162,.42)}
@media(max-width:760px){
 .inline-levels{gap:5px}
 .inline-levels select{height:40px;font-size:16px}
 .inline-levels small{font-size:8px}
}
</style>


<style id="three-research-grid">
.pdf-row .nodes,
.nodes{
  grid-template-columns:repeat(3,minmax(0,1fr)) !important;
  gap:9px !important;
}
.pdf-row .nodes.row-1,
.pdf-row .nodes.row-2,
.pdf-row .nodes.row-3{
  grid-template-columns:repeat(3,minmax(0,1fr)) !important;
  justify-content:stretch !important;
}
.pdf-row .nodes.row-1 .node:only-child,
.pdf-row .nodes.row-2 .node:only-child{
  grid-column:auto !important;
  max-width:none !important;
  justify-self:stretch !important;
}
.effect-delta{
  min-height:31px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px 5px;
  border-radius:8px;
  background:rgba(90,169,255,.07);
  border:1px solid rgba(90,169,255,.13);
  color:#b9d8ff;
  font-size:9px;
  line-height:1.35;
  text-align:center;
  font-weight:800;
}
@media(max-width:760px){
 .pdf-row .nodes,.nodes,
 .pdf-row .nodes.row-1,.pdf-row .nodes.row-2,.pdf-row .nodes.row-3{
   grid-template-columns:repeat(3,minmax(0,1fr)) !important;
   gap:5px !important;
 }
 .node{padding:7px 5px !important;min-height:145px !important;border-radius:10px !important}
 .node-top{gap:3px}
 .node-name{font-size:9px !important;line-height:1.25}
 .node-max{font-size:7px !important;padding:2px 3px !important}
 .node-buff{font-size:7.5px !important;line-height:1.25;min-height:28px}
 .inline-levels{gap:3px !important;margin-top:6px !important}
 .inline-levels small{font-size:7px !important}
 .inline-levels select{height:34px !important;font-size:13px !important;padding:0 2px !important;border-radius:8px !important}
 .inline-levels .arrow{font-size:10px;margin-top:13px}
 .effect-delta{font-size:7.5px;min-height:34px;padding:4px 3px;margin-top:5px}
}
@media(max-width:360px){
 .node-name{font-size:8px !important}
 .node-buff{display:none}
 .node{min-height:118px !important}
 .effect-delta{font-size:7px}
}
</style>


<style id="balanced-pdf-rows">
/* ثلاثة أبحاث: تملأ الصف بالكامل */
.pdf-row .nodes.row-3{
  grid-template-columns:repeat(3,minmax(0,1fr)) !important;
  max-width:980px !important;
  margin-inline:auto !important;
}

/* بحثان: عرض متوسط ومتمركزان */
.pdf-row .nodes.row-2{
  grid-template-columns:repeat(2,minmax(210px,290px)) !important;
  justify-content:center !important;
  max-width:650px !important;
  margin-inline:auto !important;
}

/* بحث واحد: في منتصف الصف */

  grid-template-columns:minmax(230px,320px) !important;

const categories=["Development","Economy","Battle"];
const catArabic={Development:"Development",Economy:"Economy",Battle:"Battle"};
const resourceArabic={bread:"bread",wood:"wood",stone:"stone",iron:"iron",gold:"gold"};
const state=JSON.parse(localStorage.getItem("saifksResearchV3")||'{"category":"Development","levels":{},"plan":[],"bonus":0,"speedups":0}');
let activeTech=null,zoom=1;

function save(){localStorage.setItem("saifksResearchV3",JSON.stringify(state))}
function fmt(n){if(!Number.isFinite(n))return"0";if(Math.abs(n)>=1e9)return(n/1e9).toFixed(2).replace(/\.?0+$/,"")+"B";if(Math.abs(n)>=1e6)return(n/1e6).toFixed(2).replace(/\.?0+$/,"")+"M";if(Math.abs(n)>=1e3)return(n/1e3).toFixed(1).replace(/\.?0+$/,"")+"K";return Math.round(n).toLocaleString("en-US")}
function duration(sec){sec=Math.max(0,Math.round(sec));if(!sec)return"0 "+tr("minutes");const d=Math.floor(sec/86400);sec%=86400;const h=Math.floor(sec/3600);sec%=3600;const m=Math.floor(sec/60);return[d?d+" "+tr("days"):"",h?h+" "+tr("hours"):"",m?m+" "+tr("minutes"):""].filter(Boolean).join(" ")}
function romanStage(name){const m=name.match(/\s([IVX]+)$/);if(!m)return 0;const map={I:1,V:5,X:10};let total=0,last=0;[...m[1]].reverse().forEach(ch=>{let v=map[ch]||0;total+=v<last?-v:v;last=Math.max(last,v)});return total}
function effectNumber(str){const m=String(str||"").match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):0}
function effectUnit(str){return String(str||"").includes("%")?"%":""}
function config(id){return state.levels[id]||{current:0,target:0}}
function getEffect(t,lvl){if(!lvl)return 0;const row=t.levels.find(x=>x.level===lvl);return row?effectNumber(row.effect):0}
function effectLabel(t){
 const buff=String(t.buff_summary||"");
 const prefix=Object.keys(STAT_I18N).sort((a,b)=>b.length-a.length).find(k=>buff.startsWith(k));
 return prefix?translatedStatPrefix(prefix):translatedName(t.name)
}
function deltaText(t,c,tg){
 const d=getEffect(t,tg)-getEffect(t,c);
 return d>0?effectLabel(t)+": +"+d.toFixed(2).replace(/\.?0+$/,"")+effectUnit(t.levels[0]?.effect):effectLabel(t)+": 0"
}
function isPlanned(id){return state.plan.includes(id)}
function toast(s){const t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}

function renderTabs(){
 const el=document.getElementById("tabs");
 el.innerHTML=categories.map(c=>{
   const count=DB.technologies.filter(t=>t.category===c).length;
   return `<button class="tab ${state.category===c?"active":""}" data-cat="${c}"><span>${categoryName(c)}</span><span class="tab-count">${count}</span></button>`;
 }).join("");
 el.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
   if(state.category===b.dataset.cat)return;
   state.category=b.dataset.cat;save();
   const tree=document.getElementById("tree");
   tree.style.opacity=".2";
   setTimeout(()=>{renderAll();tree.style.opacity="1";tree.style.transform="none";tree.style.zoom=zoom},130);
 })
}
function renderTree(){
 let techs=DB.technologies.filter(t=>t.category===state.category);
 techs.sort((a,b)=>(a.tree_order??9999)-(b.tree_order??9999));
 const rows={};techs.forEach(t=>{const r=Number.isFinite(+t.tree_row)?+t.tree_row:999;(rows[r]??=[]).push(t)});
 document.getElementById("treeTitle").textContent=tr("tree")+" · "+categoryName(state.category);
 const categoryTotal=DB.technologies.filter(t=>t.category===state.category).length;
 document.getElementById("treeMeta").textContent=techs.length+" "+tr("of")+" "+categoryTotal+" "+tr("research");
 const tree=document.getElementById("tree");tree.style.zoom=zoom;tree.style.transform="none";
 if(!techs.length){tree.innerHTML='<div class="empty">'+tr("noResults")+'</div>';return}
 tree.innerHTML=Object.keys(rows).sort((a,b)=>a-b).map((row,index)=>`<section class="tier pdf-row"><div class="tier-label">${index+1}</div><div class="nodes row-${rows[row].length}">${rows[row].sort((a,b)=>(a.tree_col??0)-(b.tree_col??0)).map(nodeHTML).join("")}</div></section>`).join("");
 tree.querySelectorAll(".inline-current").forEach(s=>s.onchange=e=>updateInlineLevel(e.target.dataset.current,"current",+e.target.value));
 tree.querySelectorAll(".inline-target").forEach(s=>s.onchange=e=>updateInlineLevel(e.target.dataset.target,"target",+e.target.value));
}
function levelOptions(max,selected,min=0){
 let out="";
 for(let i=min;i<=max;i++)out+=`<option value="${i}" ${i===selected?"selected":""}>${i}</option>`;
 return out
}
function nodeHTML(t){
 const c=config(t.id),planned=isPlanned(t.id),maxed=c.current===t.max_level;
 const cls=planned?"in-plan":maxed?"is-max":c.current>0?"in-progress":"";
 const safeTarget=Math.max(c.current,c.target);
 return `<div class="node ${cls}" data-id="${t.id}">
  <div class="node-top"><div class="node-name">${translatedName(t.name)}</div><span class="node-max">${maxed?"MAX":"MAX "+t.max_level}</span></div>
  <div class="inline-levels">
   <label><small>${tr("current")}</small><select class="inline-current" data-current="${t.id}">${levelOptions(t.max_level,c.current,0)}</select></label>
   <span class="arrow">→</span>
   <label><small>${tr("target")}</small><select class="inline-target" data-target="${t.id}">${levelOptions(t.max_level,safeTarget,c.current)}</select></label>
  </div>
  <div class="delta effect-delta">${deltaText(t,c.current,safeTarget)}</div>
 </div>`
}
function openDrawer(id){
 activeTech=DB.technologies.find(t=>t.id===id);if(!activeTech)return;
 const c=config(id);document.getElementById("detailName").textContent=activeTech.name;
 document.getElementById("detailDescription").textContent=activeTech.description;
 document.getElementById("detailBuff").textContent=activeTech.buff_summary;
 fillCurrent(c.current);fillTarget(c.current,Math.max(c.current,c.target));updateDrawerPreview();
 document.getElementById("addPlan").textContent=isPlanned(id)?"تحديث البحث في الخطة":"إضافة إلى الخطة";
 document.getElementById("saveStatus").textContent="يتم حفظ الاختيار تلقائيًا";document.getElementById("saveStatus").classList.remove("saved");
 document.getElementById("drawer").classList.add("show");document.getElementById("backdrop").classList.add("show")
}

}
function fillTarget(cur,val){

}
function updateDrawerPreview(){
 const c=+document.getElementById("currentLevel").value,tg=+document.getElementById("targetLevel").value;
 const rows=activeTech.levels.filter(x=>x.level>c&&x.level<=tg),base=rows.reduce((a,x)=>a+x.time_seconds,0),power=rows.reduce((a,x)=>a+(x.power||0),0);
 document.getElementById("levelPreview").innerHTML=`

 <div class="preview"><span>وقت الترقية</span><b>${duration(base)}</b></div>

 const targetRow=activeTech.levels.find(x=>x.level===Math.max(1,tg));
 const reqs=[];if(targetRow?.academy_level)reqs.push(["مستوى الأكاديمية",targetRow.academy_level]);
 (targetRow?.prerequisites||[]).forEach(x=>reqs.push([x.research,"Lv."+x.level]));
 document.getElementById("requirements").innerHTML=reqs.length?`<div class="req-title">متطلبات المستوى المستهدف</div>${reqs.map(r=>`<div class="req"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")}`:'<div class="req-title">لا توجد متطلبات مسجلة لهذا المستوى.</div>'
}
function commit(add){
 const c=+document.getElementById("currentLevel").value,t=+document.getElementById("targetLevel").value;
 state.levels[activeTech.id]={current:c,target:t};
 if(add&&t>c&&!state.plan.includes(activeTech.id))state.plan.push(activeTech.id);
 if(t<=c)state.plan=state.plan.filter(id=>id!==activeTech.id);
 save();closeDrawer();renderAll();toast(add?"تم تحديث الخطة":"تم حفظ المستويات")
}
function closeDrawer(){document.getElementById("drawer").classList.remove("show");document.getElementById("backdrop").classList.remove("show")}
function totals(){
 const total={time:0,power:0,res:{bread:0,wood:0,stone:0,iron:0,gold:0}};
 state.plan.forEach(id=>{const t=DB.technologies.find(x=>x.id===id);if(!t)return;const c=config(id);t.levels.filter(l=>l.level>c.current&&l.level<=c.target).forEach(l=>{total.time+=l.time_seconds||0;total.power+=l.power||0;Object.keys(total.res).forEach(k=>total.res[k]+=l.resources?.[k]||0)})});return total
}
function speedupSeconds(){
 const days=Math.max(0,+state.speedupDays||0);
 const hours=Math.max(0,+state.speedupHours||0);
 const minutes=Math.max(0,+state.speedupMinutes||0);
 return days*86400+hours*3600+minutes*60
}
function speedupText(){
 const d=Math.max(0,+state.speedupDays||0),h=Math.max(0,+state.speedupHours||0),m=Math.max(0,+state.speedupMinutes||0);
 const parts=[];if(d)parts.push(d+" يوم");if(h)parts.push(h+" ساعة");if(m)parts.push(m+" دقيقة");
 return parts.join(" و ")||"0"
}
function renderSummary(){
 const t=totals(),bonus=Math.max(0,+state.bonus||0),after=t.time/(1+bonus/100),available=speedupSeconds(),used=Math.min(after,available),remain=Math.max(0,after-available);
 document.getElementById("planCount").textContent=state.plan.length+" "+tr("planCount");document.getElementById("selectedCount").textContent=state.plan.length;
 document.getElementById("baseTime").textContent=duration(t.time);document.getElementById("bonusTime").textContent=duration(after);document.getElementById("usedSpeedups").textContent=duration(used);document.getElementById("remainingTime").textContent=duration(remain);document.getElementById("power").textContent=fmt(t.power);
 document.getElementById("resources").innerHTML=Object.entries(t.res).map(([k,v])=>`<div class="resource"><span>${tr(resourceArabic[k])}</span><b>${fmt(v)}</b></div>`).join("")
}
function updateInlineLevel(id,type,value){
 const tech=DB.technologies.find(t=>t.id===id);if(!tech)return;
 const currentConfig=config(id);
 let current=currentConfig.current,target=currentConfig.target;
 if(type==="current"){
   current=value;
   if(target<current)target=current;
 }else{
   target=Math.max(current,value);
 }
 state.levels[id]={current,target};
 if(target>current){
   if(!state.plan.includes(id))state.plan.push(id);
 }else{
   state.plan=state.plan.filter(x=>x!==id);
 }
 save();
 renderTree();
 renderPlan();
 renderSummary();
 toast(target>current?tr("added"):tr("updated"))
}
function renderPlan(){
 const el=document.getElementById("planList");
 if(!state.plan.length){el.innerHTML='<div class="empty" style="padding:35px 10px">'+tr("emptyPlan")+'</div>';return}
 el.innerHTML=state.plan.map(id=>{const t=DB.technologies.find(x=>x.id===id),c=config(id);return `<div class="plan-item"><div class="plan-item-top"><b>${translatedName(t.name)}</b><button class="remove" data-remove="${id}">✕</button></div><small>${tr("level")} ${c.current} ← ${c.target} · ${deltaText(t,c.current,c.target)}</small></div>`}).join("");
 el.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{state.plan=state.plan.filter(x=>x!==b.dataset.remove);save();renderAll()})
}
function renderAll(){renderTabs();renderTree();renderSummary();renderPlan()}
function copySummary(){
 const t=totals(),bonus=Math.max(0,+state.bonus||0),after=t.time/(1+bonus/100),remain=Math.max(0,after-speedupSeconds());
 let s=`${tr("summary")}\n\n`;
 state.plan.forEach(id=>{const x=DB.technologies.find(t=>t.id===id),c=config(id);s+=`${translatedName(x.name)}: ${c.current} → ${c.target} (${deltaText(x,c.current,c.target)})\n`});
 s+=`\n${tr("bonusLabel")}: ${bonus}%\n${tr("baseTime")}: ${duration(t.time)}\n${tr("afterBonus")}: ${duration(after)}\n${tr("speedupsLabel")}: ${speedupText()}\n${tr("remainingTime")}: ${duration(remain)}\n${tr("power")}: ${fmt(t.power)}\n`;
 Object.entries(t.res).forEach(([k,v])=>s+=`${tr(resourceArabic[k])}: ${fmt(v)}\n`);
 navigator.clipboard.writeText(s).then(()=>toast(tr("copied")))
}

document.getElementById("researchBonus").value=state.bonus>0?state.bonus:"";
state.speedupDays=state.speedupDays??Math.floor((state.speedups||0)/24);
state.speedupHours=state.speedupHours??Math.floor((state.speedups||0)%24);
state.speedupMinutes=state.speedupMinutes??0;
document.getElementById("speedupDays").value=state.speedupDays>0?state.speedupDays:"";
document.getElementById("speedupHours").value=state.speedupHours>0?state.speedupHours:"";
document.getElementById("speedupMinutes").value=state.speedupMinutes>0?state.speedupMinutes:"";
document.getElementById("researchBonus").oninput=e=>{state.bonus=Math.max(0,+e.target.value||0);save();renderSummary()};
document.getElementById("speedupDays").oninput=e=>{state.speedupDays=Math.max(0,Math.floor(+e.target.value||0));save();renderSummary()};
document.getElementById("speedupHours").oninput=e=>{state.speedupHours=Math.min(23,Math.max(0,Math.floor(+e.target.value||0)));if(+e.target.value>23)e.target.value=23;save();renderSummary()};
document.getElementById("speedupMinutes").oninput=e=>{state.speedupMinutes=Math.min(59,Math.max(0,Math.floor(+e.target.value||0)));if(+e.target.value>59)e.target.value=59;save();renderSummary()};
function autoSaveSelection(){
 if(!activeTech)return;
 const current=+document.getElementById("currentLevel").value;
 const target=+document.getElementById("targetLevel").value;
 state.levels[activeTech.id]={current,target};
 if(target<=current) state.plan=state.plan.filter(id=>id!==activeTech.id);
 save();
 const badge=document.getElementById("saveStatus");
 badge.textContent="✓ تم تثبيت المستوى الحالي والمستهدف";
 badge.classList.add("saved");
 renderTree();
 renderSummary();
 renderPlan();
}
document.getElementById("currentLevel").onchange=e=>{
 const cur=+e.target.value;
 const previousTarget=+document.getElementById("targetLevel").value;
 fillTarget(cur,Math.max(cur,previousTarget));
 updateDrawerPreview();
 autoSaveSelection();
};
document.getElementById("targetLevel").onchange=()=>{
 updateDrawerPreview();
 autoSaveSelection();
};
document.getElementById("addPlan").onclick=()=>commit(true);document.getElementById("saveOnly").onclick=()=>commit(false);
document.getElementById("closeDrawer").onclick=closeDrawer;document.getElementById("backdrop").onclick=closeDrawer;
document.getElementById("copyPlan").onclick=copySummary;
document.getElementById("clearPlan").onclick=()=>{if(confirm(tr("confirmClear"))){state.levels={};state.plan=[];save();renderAll();toast(tr("cleared"))}};
document.getElementById("resetAll").onclick=()=>{if(confirm(tr("confirmReset"))){state.levels={};state.plan=[];state.bonus=0;state.speedups=0;state.speedupDays=0;state.speedupHours=0;state.speedupMinutes=0;document.getElementById("researchBonus").value="";document.getElementById("speedupDays").value="";document.getElementById("speedupHours").value="";document.getElementById("speedupMinutes").value="";save();renderAll();toast(tr("resetDone"))}};
document.getElementById("languageSelect").onchange=e=>{currentLang=e.target.value;localStorage.setItem("saifksLanguage",currentLang);localStorage.setItem("language",currentLang);applyLanguage()};
applyLanguage();
</script>
</body>
</html>
