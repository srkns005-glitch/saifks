name: Apply Governor Center v21

on:
  push:
    paths:
      - ".github/workflows/governor-center-v21.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested Governor Center files
        shell: bash
        env:
          GOVERNOR_ARCHIVE: ""
        run: |
          set -euo pipefail
          printf '%s' "$GOVERNOR_ARCHIVE" | base64 -d > /tmp/governor-center-v21.tar.gz
          tar -xzf /tmp/governor-center-v21.tar.gz
          rm -f \
            governor-center/app.js \
            governor-center/styles.css \
            governor-center/assets/charms/W.html \
            governor-center/assets/gear/E.html \
            governor-center/data/Q.html \
            .github/workflows/governor-center-v21.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A governor-center .github/workflows/governor-center-v21.yml
          git diff --cached --check
          git commit -m "Improve and secure Governor Center"
          git push origin HEAD:main
