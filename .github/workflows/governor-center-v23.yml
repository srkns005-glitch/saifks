name: Apply Governor Center v23

on:
  push:
    paths:
      - ".github/workflows/governor-center-v23.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested Governor Center charm fix
        shell: bash
        env:
          GOVERNOR_ARCHIVE: ""
        run: |
          set -euo pipefail
          printf '%s' "$GOVERNOR_ARCHIVE" | base64 -d > /tmp/governor-center-v23.tar.gz
          tar -xzf /tmp/governor-center-v23.tar.gz
          rm -f .github/workflows/governor-center-v23.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governor-center/index.html governor-center/app-v5.js governor-center/styles-v5.css .github/workflows/governor-center-v23.yml
          git diff --cached --check
          git commit -m "Fix Governor charm card expansion"
          git push origin HEAD:main
