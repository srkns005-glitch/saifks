name: Publish KINGSHOT preview

on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'gold-calculator/**'
      - 'event-center/**'
      - 'hero-center/**'
      - 'hero-gear-center/**'
      - 'governor-center/**'
      - 'research/**'
      - 'masters/**'
      - 'logo.png'
      - '.github/workflows/publish-mobile-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kingshot-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build public preview artifact
        shell: bash
        run: |
          mkdir -p public-site
          cp -R preview/. public-site/
          for dir in gold-calculator event-center hero-center hero-gear-center governor-center research masters; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "public-site/$dir"
            fi
          done
          if [ -f logo.png ]; then cp logo.png public-site/logo.png; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-site
      - id: deployment
        uses: actions/deploy-pages@v4
