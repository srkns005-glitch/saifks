<style>

.summarybar{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:37px 2px 17px}.summarybar h2{margin:0;font-size:clamp(1.45rem,3vw,2rem);line-height:1.25}.summarybar span{color:#c0ccda;font-size:.9rem;white-space:nowrap}

.x{width:43px;padding:0;font-size:1.1rem}

.sections>details{min-width:0;margin:0;overflow:hidden;border:1px solid #3b5369;border-radius:14px;background:#142a3d}
.sections>details:nth-of-type(n+5){grid-column:1/-1}
.sections>details[open]{border-color:#536d81}

.sections>details>summary{min-height:55px;padding:16px 56px 16px 18px;color:#eed18e;font-weight:850;line-height:1.4}

.copy,.topbtn{min-height:46px;border-radius:10px;color:#fff;font-weight:850}
.copy{grid-column:1;grid-row:1;border:1px solid #3fb389;background:var(--green)}
.topbtn{grid-column:2;grid-row:1;padding:0 17px;border:1px solid #4f708c;background:#234660}

.research-footer-inner{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px}

.hero{margin-top:13px;padding:34px 23px;border-radius:19px}.hero h1{font-size:clamp(2.2rem,9vw,3rem)}.hero>p:last-child{margin-top:15px;font-size:.94rem}
.toolbar{margin-top:14px;padding:12px;border-radius:15px}.tabs{padding-top:13px}.tab,.subtab{min-height:39px;padding:8px 12px;font-size:.83rem}
.summarybar{margin:27px 1px 13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cardbody{gap:8px;padding:12px}.card h3{font-size:1.1rem}.badge{font-size:.67rem}.class-logo{width:18px;height:18px}
.modal{padding:0}.panel{width:100%;height:100dvh;border:0;border-radius:0}.topbar{padding:calc(8px + env(safe-area-inset-top)) 12px 8px}.banner{grid-template-columns:92px minmax(0,1fr);gap:15px;padding:19px 16px}.banner img{width:92px;height:92px;border-radius:15px}.banner h2{font-size:1.65rem}.banner p{font-size:.83rem}.class-identity .class-logo{width:20px;height:20px}.modal-jump{padding:11px 12px}.sections{gap:10px;padding:14px 12px 25px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom{padding:9px 12px calc(9px + env(safe-area-inset-bottom))}.topbtn{padding:0 10px}.research-footer{padding:19px 12px;font-size:12px}.research-footer-inner{gap:8px}}

const SAIF_TIPS={"helga":"Use Helga when your formation needs protection: her expedition skills can reduce damage taken and boost squad attack and lethality. Check her skill levels before relying on the chance-based reduction.","amadeus":"Amadeus is a strong rally damage option: his expedition skills boost squad lethality and attack, while his exclusive gear adds rally attack. Prioritize the relevant expedition skills for this role.","saul":"Saul is useful beyond combat: his expedition skills improve construction speed and reduce construction cost. Switch him into the appropriate lineup when building, then review your combat lineup afterward.","jabel":"Use Jabel to balance damage and survival: her expedition skills can reduce incoming damage and increase squad damage. Remember that two of her effects depend on a chance to trigger.","zoe":"Zoe adds attack and can make enemies take more damage. Pair her with heroes that benefit from a sustained attack, and check her expedition skill levels before comparing her with other infantry.","hilde":"Hilde supports both squad attack and defense. She suits a balanced formation when you need more than a single damage bonus; compare her other expedition skills before choosing a rally role.","marlin":"Marlin's damage boost is chance based. Use him when your lineup can benefit from burst damage, but compare his reliable bonuses with other archers before investing heavily.","eric":"Eric reduces enemy squad attack. Consider him when your formation needs to withstand pressure, and judge his value alongside the rest of your infantry and defensive bonuses.","jaeger":"Jaeger's expedition effect can increase damage for several turns when it triggers. Pair him with a damage focused lineup, but do not count a chance based effect as guaranteed.","petra":"Petra can increase the damage enemies take when her curse triggers. Place her alongside strong damage dealers and compare the actual skill level before judging her contribution.","alcar":"Alcar periodically reduces damage taken by infantry and archers. Consider him for longer fights, especially when protecting those two troop types matters to your formation.","rosa":"Rosa offers a chance to raise all squads' damage. She fits an offensive lineup; compare her trigger chance and skill level with more consistent damage buffs.","margot":"Margot increases total squad attack. Use her as an offensive cavalry option, then compare the rest of her expedition kit against the specific rally or defense role you need.","long-fei":"Long Fei offers chance based damage reduction for the whole squad. Use him when survival is the priority, and check his skill level before relying on the effect.","vivian":"Vivian raises the damage enemies take from your squads. Pair her with your strongest damage dealers so the debuff supports the whole formation.","thrud":"Thrud helps infantry and archers by reducing damage taken and increasing damage dealt. She is especially useful when both troop types are central to your formation.","triton":"Triton increases total squad defense. Consider him when your formation is losing troops too quickly, and weigh that defense against any attack bonus you would give up.","yang":"Yang adds an extra squad strike every four turns. He favors fights that last long enough to benefit from repeated triggers; compare him carefully in short battles.","sophia":"Sophia can reduce damage received by all squads when her effect triggers. Use her in a survival oriented lineup, while remembering the reduction is chance based.","charles":"Charles lowers enemy squad lethality. Consider him against high damage opponents and compare this debuff with the protection offered by your other infantry.","wee-woo":"Wee-Woo raises squad attack and lethality. She is a straightforward offensive archer; prioritize expedition skill levels that strengthen the role you use her for.","ava":"Ava reduces enemy squad defense. Pair her with damage focused heroes so your formation can take advantage of the weaker target.","yeonwoo":"Yeonwoo increases squad lethality. Check her expedition skill level before using her as a support hero in a damage focused lineup.","diana":"Diana reduces Governor Stamina cost. Use her for activities that consume stamina, and compare the displayed cost before spending it.","quinn":"Quinn reduces damage taken by all troops. He is a practical defensive option when your lineup needs protection more than another attack bonus.","howard":"Howard reduces damage taken by all troops. Use him in a defensive support slot when survival matters, and compare his skill level with your other protectors.","gordon":"Gordon increases squad health. Consider him for a sturdier formation and compare his health bonus with damage reduction alternatives.","fahd":"Fahd reduces enemy squad damage dealt. He is worth considering when the opponent hits hard, especially if your other heroes already provide enough offense.","amane":"Amane increases total squad attack. Check her expedition skill level when choosing a support hero for an offensive formation.","chenko":"Chenko increases total squad lethality. He can support a damage focused formation; make sure you compare the skill level used in your lineup.","seth":"Seth increases the town's iron output. Use him for resource production rather than judging him by frontline combat roles.","forrest":"Forrest increases sawmill output. He is useful for wood production; use combat focused heroes for battle lineups.","edwin":"Edwin increases quarry output. Put his value in the context of stone production when planning town resources.","olive":"Olive increases mill output. Consider her for food production and compare her production skill level with your current resource needs."};

const AR_SAIF_TIPS={"helga":"استخدم هيلغا عندما يحتاج تشكيلك إلى حماية؛ مهاراتها تقلل الضرر الوارد وقد تعزز الهجوم والفتك. راجع مستوى المهارة لأن تخفيف الضرر يعتمد على احتمال التفعيل.","amadeus":"أماديوس خيار هجومي للراليات؛ مهاراته ترفع هجوم القوات وفتكها، ويضيف سلاحه الحصري هجوم الرالي. طوّر مهارات الحملة المرتبطة بهذا الدور.","saul":"لا تقيّم سول بالقتال فقط؛ لديه مهارات تسرّع البناء وتخفض تكلفته. راجع مكافآته عند التخطيط لترقيات المباني.","jabel":"جابيل توازن بين الهجوم والبقاء؛ تقلل الضرر الوارد وقد ترفع ضرر القوات. بعض تأثيراتها احتمالية، فراجع مستوى المهارة.","zoe":"زوي ترفع الهجوم وقد تزيد الضرر الذي يتلقاه العدو. ضعها مع أبطال يستفيدون من زيادة الضرر، وقارن مهاراتها قبل الاستثمار.","hilde":"هيلدا تدعم هجوم القوات ودفاعها. تناسب التشكيلات المتوازنة عندما تحتاج مكافأتين معاً بدل التركيز على الضرر وحده.","marlin":"زيادة الضرر لدى مارلين تعتمد على احتمال التفعيل. قارنه بالرماة أصحاب المكافآت الثابتة قبل أن تستثمر فيه بكثافة.","eric":"إريك يقلل هجوم قوات الخصم. فكّر فيه عندما تحتاج تشكيلتك إلى الصمود، وقارن فائدته بمكافآت الدفاع الأخرى.","jaeger":"يمكن لتأثير ييغر رفع الضرر لعدة أدوار عند تفعيله. يناسب التشكيلات الهجومية، لكن لا تعتمد على التأثير الاحتمالي كأنه مضمون.","petra":"قد تزيد بيترا الضرر الذي يتلقاه العدو عند تفعيل تأثيرها. اجمعها مع أبطال ضرر أقوياء وراجع مستوى مهارتها.","alcar":"يقلل ألكار الضرر عن المشاة والرماة على فترات. يفيد في المعارك الطويلة، خاصة إذا اعتمد تشكيلك على هذين النوعين.","rosa":"تمنح روزا فرصة لزيادة ضرر جميع القوات. قارن احتمال التفعيل ومستوى مهارتها بمكافآت الضرر الثابتة.","margot":"ترفع مارغوت هجوم جميع القوات. استخدمها ضمن تشكيل هجومي، ثم قارن بقية مهاراتها بدور الرالي أو الدفاع المطلوب.","long-fei":"يمنح لونغ فاي تخفيف ضرر احتمالياً لجميع القوات. يناسب أولوية الصمود؛ تحقق من مستوى المهارة قبل الاعتماد عليه.","vivian":"تزيد فيفيان الضرر الذي يتلقاه الأعداء من قواتك. ضعها مع أقوى أبطال الضرر لديك ليستفيد التشكيل كله.","thrud":"تساعد ثرود المشاة والرماة بتقليل الضرر الوارد وزيادة الضرر الصادر. تفيد عندما يشكل النوعان أساس تشكيلتك.","triton":"يرفع تريتون دفاع جميع القوات. فكّر فيه إذا كان تشكيلك يخسر القوات بسرعة، وقارن مكسب الدفاع بما تتنازل عنه من هجوم.","yang":"يضيف يانغ ضربة إضافية كل أربعة أدوار. يفيد أكثر في القتال الذي يستمر بما يكفي لتكرار هذا التأثير.","sophia":"قد تقلل صوفيا الضرر الوارد لجميع القوات عند تفعيل مهارتها. تناسب تشكيلات الصمود، مع الانتباه إلى احتمال التفعيل.","charles":"يخفض تشارلز فتك قوات العدو. فكّر فيه ضد الخصوم مرتفعي الضرر وقارنه ببقية أبطال المشاة الدفاعيين.","wee-woo":"يرفع وي وو هجوم القوات وفتكها. خيار هجومي واضح للرماة؛ أعطِ الأولوية لمهارات الحملة المرتبطة بدورهما.","ava":"تخفض آفا دفاع قوات العدو. اجمعها مع أبطال هجومية لاستغلال ضعف دفاع الخصم.","yeonwoo":"ترفع يون وو فتك القوات. راجع مستوى مهارتها عند اختيار بطل دعم لتشكيلة تركز على الضرر.","diana":"تخفض ديانا تكلفة طاقة الحاكم. استخدم مكافأتها في الأنشطة التي تستهلك الطاقة، وتأكد من التكلفة الظاهرة قبل الصرف.","quinn":"يقلل كوين الضرر الذي تتلقاه جميع القوات. خيار دفاعي عملي عندما تحتاج الحماية أكثر من زيادة الهجوم.","howard":"يقلل هوارد الضرر الذي تتلقاه جميع القوات. استخدمه للدعم الدفاعي عندما يكون الصمود أهم، وقارن مستوى مهارته بغيره.","gordon":"يرفع غوردون صحة القوات. يفيد في تشكيل أكثر صموداً؛ قارن مكافأة الصحة بخيارات تخفيف الضرر.","fahd":"يخفض فهد الضرر الذي تسببه قوات العدو. فكّر فيه ضد الخصوم ذوي الهجوم القوي، خاصة إذا كان هجوم تشكيلتك كافياً.","amane":"ترفع أماني هجوم جميع القوات. راجع مستوى مهارتها عند اختيار بطل دعم لتشكيلة هجومية.","chenko":"يرفع تشينكو فتك جميع القوات. يمكنه دعم تشكيلة هجومية؛ قارن مستوى المهارة قبل اختياره.","seth":"يزيد سيث إنتاج الحديد في المدينة. قيّم فائدته في جمع الموارد بدلاً من مقارنته بأبطال القتال الأمامي.","forrest":"يزيد فورست إنتاج الخشب من المنشرة. استخدم مكافأته للإنتاج واترك أدوار القتال للأبطال المناسبين.","edwin":"يزيد إدوين إنتاج الحجر من المحجر. قيّم فائدته بحسب حاجتك الحالية لموارد المدينة.","olive":"تزيد أوليف إنتاج الطعام من المطحنة. راجع مستوى مهارة الإنتاج وحاجتك للطعام عند استخدامها."};
