<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101c">
  <title>SaifKS Masters</title>
  <script>
(function(){
  const supported=['en','ar','fr','es','de','tr','ko','ja','zh'];
  let language='en';
  try{
    const saved=localStorage.getItem('saifksLanguage');
    if(supported.includes(saved)) language=saved;
  }catch(_){}
  document.documentElement.lang=language;
  document.documentElement.dir=language==='ar'?'rtl':'ltr';
})();
</script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <strong data-i18n="app.title">Masters Planner</strong>
        <div id="appStatus" data-i18n="app.subtitle">Plan affinity, skills, and materials</div>
      </div>
      <select class="language-select" id="languageSelect" aria-label="Language">
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="tr">Türkçe</option>
        <option value="ko">한국어</option>
        <option value="ja">日本語</option>
        <option value="zh">简体中文</option>
      </select>
    </header>

    <div class="app-grid">
      <aside class="app-sidebar">
        <section class="panel section">
          <img data-master-image alt="" width="160" height="160">
          <h1 data-master-name>Valora</h1>
        </section>
        <nav class="panel master-list" id="masterList" aria-label="Masters"></nav>
      </aside>

      <main class="app-main">
        <section class="panel section">
          <h2 data-i18n="section.affinity">Affinity</h2>
          <div id="affinityRoot"></div>
        </section>
        <section class="panel section">
          <h2 data-i18n="section.skills">Skills</h2>
          <div id="skillsRoot"></div>
        </section>
        <section class="panel section">
          <h2 data-i18n="section.materials">Available Materials</h2>
          <div id="materialsRoot"></div>
        </section>
        <section class="panel section">
          <h2 data-i18n="section.summary">Summary</h2>
          <table class="summary-table">
            <thead>
              <tr>
                <th data-i18n="section.materials">Material</th>
                <th data-i18n="field.available">Available</th>
                <th data-i18n="field.required">Required</th>
                <th data-i18n="field.remaining">Remaining</th>
              </tr>
            </thead>
            <tbody id="summaryRoot"></tbody>
          </table>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
